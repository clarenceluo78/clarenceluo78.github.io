<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  
  
    <title>Search · Haoyan's Blog</title>
  
  
  <meta name="description" content="A personal blog about ideas, patterns, and questions I find worth exploring.">
  <meta name="author" content="Haoyan (Ryan) Luo">
  <link rel="canonical" href="http://localhost:4000/blog/search/">
  <link rel="alternate" type="application/atom+xml" title="Haoyan's Blog" href="http://localhost:4000/blog/feed.xml">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Search">
  <meta property="og:description" content="A personal blog about ideas, patterns, and questions I find worth exploring.">
  <meta property="og:url" content="http://localhost:4000/blog/search/">
  
  <meta property="og:image" content="http://localhost:4000/assets/blog/og-blog.png">
  <meta name="twitter:card" content="summary_large_image">

  <script>
    (function () {
      var saved = localStorage.getItem('blog-theme');
      document.documentElement.dataset.theme = saved || 'light';
    }());
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/blog/blog.css">

  
</head>
<body class="blog-body">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="blog-header">
  <div class="blog-shell blog-header__inner">
    <a class="blog-brand" href="/blog/" aria-label="Haoyan's Blog home">
      <span class="blog-brand__title">Haoyan's Blog</span>
      <span class="blog-brand__author">Haoyan (Ryan) Luo</span>
    </a>
    <nav class="blog-nav" aria-label="Haoyan's Blog navigation">
      <a href="/blog/">Haoyan's Blog</a>
      <a href="/blog/tags/">Tags</a>
      <a href="/blog/search/" aria-current="page">Search</a>
      <a href="/">Home</a>
      <a class="icon-link" href="/blog/feed.xml" aria-label="Subscribe via RSS" title="RSS feed">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4a15 15 0 0 1 15 15h-3A12 12 0 0 0 5 7V4Zm0 6a9 9 0 0 1 9 9h-3a6 6 0 0 0-6-6v-3Zm2 6.5A2.5 2.5 0 1 1 7 21a2.5 2.5 0 0 1 0-5Z"/></svg>
      </a>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <svg class="theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 17.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11ZM12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
        <svg class="theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8a8.5 8.5 0 1 0 11.5 11.5Z"/></svg>
      </button>
    </nav>
  </div>
</header>

  <main id="main-content" class="blog-main">
  <div class="blog-shell">
    <header class="page-intro">
      <h1>Search</h1>
      <p>Search every post, then narrow the results with tags.</p>
    </header>
    <section class="search" data-search-index="/blog/search-index.json">
  <label class="search-label" for="blog-search-input">Search the full text</label>
  <div class="search-box">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
    <input id="blog-search-input" type="search" autocomplete="off" placeholder="Search titles, text, headings, and tags">
  </div>
  <div class="search-tags" aria-label="Filter by tags">
    <p>Filter by tags</p>
    <div id="search-tag-filters"></div>
  </div>
  <p id="search-status" class="search-status" aria-live="polite"></p>
  <div id="search-results" class="search-results"></div>
</section>
<script defer src="/assets/blog/search.js"></script>

  </div>
</main>

  <footer class="blog-footer">
  <div class="blog-shell blog-footer__inner">
    <p>© 2026 Haoyan (Ryan) Luo</p>
  </div>
</footer>

  <script defer src="/assets/blog/blog.js"></script>
</body>
</html>
