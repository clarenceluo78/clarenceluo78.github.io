<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="An agentic RL trajectory: after the task input, model outputs and tool results alternate, and hidden tests give the final reward. Only the model outputs enter the loss.">
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #222; }
    .label { font-size: 13px; fill: #666; }
    .body { font-size: 14px; }
    .mono { font-family: "Source Code Pro", SFMono-Regular, Consolas, monospace; font-size: 13px; }
    .legend { font-size: 13px; fill: #444; }
  </style>
  <rect x="0" y="0" width="720" height="420" rx="14" fill="#faf9f6"/>

  <text class="label" x="22" y="45">Input</text>
  <rect x="80" y="24" width="460" height="34" rx="7" fill="#e8f1f5" stroke="#b9d3de"/>
  <text class="body" x="96" y="46">Task: fix issue #123 in this repository</text>

  <text class="label" x="22" y="95">Model</text>
  <rect x="80" y="74" width="460" height="34" rx="7" fill="#ece4fb" stroke="#8a63d2" stroke-width="1.5"/>
  <text class="body" x="96" y="96">Think → call <tspan class="mono">read_file("utils.py")</tspan></text>

  <text class="label" x="22" y="145">Tool</text>
  <rect x="80" y="124" width="460" height="34" rx="7" fill="#eeeeee" stroke="#cfcfcf"/>
  <text class="body" x="96" y="146" fill="#555">Returns the file contents (~2K tokens)</text>

  <text class="label" x="22" y="195">Model</text>
  <rect x="80" y="174" width="460" height="34" rx="7" fill="#ece4fb" stroke="#8a63d2" stroke-width="1.5"/>
  <text class="body" x="96" y="196">Think → edit code → call <tspan class="mono">run_tests()</tspan></text>

  <text class="label" x="22" y="245">Tool</text>
  <rect x="80" y="224" width="460" height="34" rx="7" fill="#eeeeee" stroke="#cfcfcf"/>
  <text class="body" x="96" y="246" fill="#555">Returns <tspan class="mono">2 passed, 1 failed</tspan></text>

  <text class="label" x="22" y="295">Model</text>
  <rect x="80" y="274" width="460" height="34" rx="7" fill="#ece4fb" stroke="#8a63d2" stroke-width="1.5"/>
  <text class="body" x="96" y="296">Edit again → submit</text>

  <text class="label" x="22" y="345">Reward</text>
  <rect x="80" y="324" width="460" height="34" rx="7" fill="#fdf1dc" stroke="#e0b25c"/>
  <text class="body" x="96" y="346">All hidden tests pass → <tspan class="mono">r = 1</tspan></text>

  <path d="M556 80 L566 80 L566 302 L556 302" fill="none" stroke="#8a63d2" stroke-width="1.5"/>
  <text class="legend" x="578" y="180">The whole trajectory</text>
  <text class="legend" x="578" y="200">shares one advantage A</text>

  <rect x="80" y="380" width="16" height="16" rx="3" fill="#ece4fb" stroke="#8a63d2" stroke-width="1.5"/>
  <text class="legend" x="104" y="393">Model-generated: in the loss (mask = 1)</text>
  <rect x="380" y="380" width="16" height="16" rx="3" fill="#eeeeee" stroke="#cfcfcf"/>
  <text class="legend" x="404" y="393">Input and tool output: masked (mask = 0)</text>
</svg>
